# frontend/chart/values.yaml

---
app: {{ cookiecutter.project_slug }}
namespace: {{ cookiecutter.__deployment_slug }}
replicaCount: 1
image:
  pullPolicy: Always
  repository: {{ cookiecutter.project_slug }}/frontend
  tag: latest
service:
  type: ClusterIP
  name: frontend
  port: 8080
  hostname: 0.0.0.0
langgraph:
  deployment:
    url: http://inference:8001/api/v1
copilotkit:
  telemetry:
    disabled: true
