services:
  database:
    profiles: [all, inference, backend, database]
    build: database
    image: {{ cookiecutter.project_slug }}/database:latest
    container_name: {{ cookiecutter.project_slug }}-database
    ports:
      - "5432:5432"
    volumes:
      - database:/var/lib/postgresql/data
    env_file:
      - database/${ENV_FILE:-.env.example}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d {{ cookiecutter.project_slug }}"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 5s

  backend:
    profiles: [all, inference, backend]
    build: backend
    image: {{ cookiecutter.project_slug }}/backend:latest
    container_name: {{ cookiecutter.project_slug }}-backend
    ports:
      - "8000:8000"
    env_file:
      - backend/${ENV_FILE:-.env.example}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/api/v1/health/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 5s

  tools:
    profiles: [all, inference, tools]
    build: tools
    image: {{ cookiecutter.project_slug }}/tools:latest
    container_name: {{ cookiecutter.project_slug }}-tools
    ports:
      - "8002:8002"
    env_file:
      - tools/${ENV_FILE:-.env.example}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8002/api/v1/health/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 5s

  inference:
    profiles: [all, inference]
    build: inference
    image: {{ cookiecutter.project_slug }}/inference:latest
    container_name: {{ cookiecutter.project_slug }}-inference
    ports:
      - "8001:8001"
    env_file:
      - inference/${ENV_FILE:-.env.example}
    depends_on:
      backend:
        condition: service_healthy
      tools:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8001/api/v1/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 5s

  frontend:
    profiles: [all, frontend]
    build:
      context: frontend
      args:
        LANGGRAPH_DEPLOYMENT_URL: "http://{{ cookiecutter.project_slug }}-inference:8001"
    image: {{ cookiecutter.project_slug }}/frontend:latest
    container_name: {{ cookiecutter.project_slug }}-frontend
    ports:
      - "8080:8080"
    env_file:
      - frontend/${ENV_FILE:-.env.example}

volumes:
  database:
