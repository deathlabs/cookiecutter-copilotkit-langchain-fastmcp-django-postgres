# zarf.yaml

---
kind: ZarfPackageConfig
metadata:
  name: {{ cookiecutter.__deployment_slug }}
  version: 0.1.0
  annotations:
    dev.uds.title: {{ cookiecutter.project_slug }}

variables:
  - name: OPENAI_APIKEY
    sensitive: true
    description: OpenAI API key (used by inference)
  - name: GEOCODING_APIKEY
    sensitive: true
    description: Geocoding API key (used by tools)

components:
  - name: uds-package
    required: true
    manifests:
      - name: {{ cookiecutter.__deployment_slug }}
        namespace: {{ cookiecutter.__deployment_slug }}
        files:
          - uds-package.yaml
  - name: database
    required: true
    charts:
      - name: database
        version: 0.1.0
        namespace: {{ cookiecutter.__deployment_slug }}
        localPath: database/chart
        valuesFiles:
          - database/chart/values.yaml
    images:
      - {{ cookiecutter.project_slug }}/database:latest
  - name: backend
    required: true
    charts:
      - name: backend
        version: 0.1.0
        namespace: {{ cookiecutter.__deployment_slug }}
        localPath: backend/chart
        valuesFiles:
          - backend/chart/values.yaml
    images:
      - {{ cookiecutter.project_slug }}/backend:latest
  - name: tools
    required: true
    charts:
      - name: tools
        version: 0.1.0
        namespace: {{ cookiecutter.__deployment_slug }}
        localPath: tools/chart
        valuesFiles:
          - tools/chart/values.yaml
    images:
      - {{ cookiecutter.project_slug }}/tools:latest
  - name: inference
    required: true
    charts:
      - name: inference
        version: 0.1.0
        namespace: {{ cookiecutter.__deployment_slug }}
        localPath: inference/chart
        valuesFiles:
          - inference/chart/values.yaml
    images:
      - {{ cookiecutter.project_slug }}/inference:latest
  - name: frontend
    required: true
    charts:
      - name: frontend
        version: 0.1.0
        namespace: {{ cookiecutter.__deployment_slug }}
        localPath: frontend/chart
        valuesFiles:
          - frontend/chart/values.yaml
    images:
      - {{ cookiecutter.project_slug }}/frontend:latest
